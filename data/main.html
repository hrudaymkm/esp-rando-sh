<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Material Handler</title>
	<link rel="icon" href="/favicon.ico">

	<style>
		body {
			margin: 0;
			padding: 20px;
			background: #0f1117;
			color: white;
			font-family: Arial;
			text-align: center
		}

		.card {
			max-width: 450px;
			margin: auto;
			padding: 20px;
			background: #1a1d26;
			border-radius: 16px
		}

		h1 {
			color: #4da6ff
		}

		h3 {
			margin-bottom: 8px
		}

		hr {
			border: 0;
			border-top: 1px solid #333;
			margin: 22px 0
		}

		.nav {
			width: 240px;
			padding: 14px;
			border: 0;
			border-radius: 10px;
			background: #0780ff;
			color: white;
			font-size: 17px
		}

		#status {
			margin-bottom: 15px;
			font-weight: bold
		}

		#speed,
		#tspeed {
			font-size: 20px;
			font-weight: bold;
			margin: 8px
		}

		#bar {
			height: 16px;
			background: #303746;
			border-radius: 10px;
			overflow: hidden
		}

		#fill {
			height: 100%;
			width: 0;
			background: #0780ff;
			transition: .1s
		}

		#slider {
			width: 100%;
			height: 45px;
			accent-color: #0780ff;
			touch-action: none
		}

		#dir {
			color: #aaa;
			margin-top: 6px
		}

		#lastcmd {
			margin-top: 12px;
			color: #777;
			font-size: 12px;
			min-height: 16px
		}

		.info {
			color: #aaa;
			font-size: 14px;
			line-height: 1.5;
			margin-top: 15px
		}

		@media(min-width:700px) {
			#touch {
				display: none
			}
		}

		@media(max-width:699px) {
			#pc {
				display: none
			}
		}
	</style>
</head>

<body>

	<div class="card">

		<div id="status">🔴 Disconnected</div>

		<h1>Material Handler</h1>

		<a href="/superstructure.html">
			<button class="nav">Superstructure Controls</button>
		</a>

		<hr>

		<div id="pc">
			<h3>Turret Speed</h3>

			<div id="speed">100</div>

			<div id="bar">
				<div id="fill"></div>
			</div>

			<div class="info">
				A / D = Turret<br>
				← / → = Speed<br>
				Shift + S = Stop
			</div>
		</div>

		<div id="touch">
			<h3>Turret</h3>

			<div style="display:flex;justify-content:space-between;color:#aaa">
				<span>Left</span>
				<span>STOP</span>
				<span>Right</span>
			</div>

			<input id="slider" type="range" min="-220" max="220" value="0" step="10">

			<div id="tspeed">Speed: 0</div>
			<div id="dir">Stopped</div>

			<div class="info">Drag slider to move</div>
		</div>

		<div id="lastcmd"></div>

	</div>

	<script>

		let speed = 100;
		const min = 100;
		const max = 220;
		const step = 10;

		let turretSpeed = 0;

		const status = document.getElementById("status");
		const speedEl = document.getElementById("speed");
		const fill = document.getElementById("fill");
		const slider = document.getElementById("slider");
		const tspeed = document.getElementById("tspeed");
		const dir = document.getElementById("dir");
		const lastcmd = document.getElementById("lastcmd");
		const host = location.hostname;

		const testMode =
			location.protocol === "file:" ||
			host === "localhost" ||
			host === "127.0.0.1";

		let ws = null;

		if (testMode) {

			status.innerText = "🟡 UI TEST MODE";

		} else {

			ws = new WebSocket(`ws://${location.host}/ws`);

			ws.onopen = () => {
				status.innerText = "🟢 Connected";
			};

			ws.onclose = () => {
				status.innerText = "🔴 Disconnected";
			};

			ws.onerror = () => {
				status.innerText = "🔴 Connection Error";
			};
		}

		/* =========================
			Send command
			========================= */

		function tx(cmd) {

			lastcmd.innerText = "Command: " + cmd;

			if (testMode) {
				simulate(cmd);
				return;
			}

			if (ws && ws.readyState === WebSocket.OPEN)
				ws.send(cmd);
		}


		/* =========================
			Fake ESP32 in test mode
			========================= */

		function simulate(cmd) {

			if (!testMode) return;

			if (cmd === "turret:stop") {
				turretSpeed = 0;
				showTouch(0);
				return;
			}

			if (cmd === "system:stop") {
				turretSpeed = 0;
				held.clear();

				slider.value = 0;

				showTouch(0);

				status.innerText = "🟡 TEST: EMERGENCY STOP";
				setTimeout(() => {
					status.innerText = "🟡 UI TEST MODE";
				}, 700);

				return;
			}

			if (cmd.startsWith("turret:speed:")) {

				turretSpeed = parseInt(
					cmd.split(":")[2]
				);

				showTouch(turretSpeed);
			}
		}


		/* =========================
			PC speed bar
			========================= */

		function updateSpeed() {

			speedEl.innerText = speed;

			fill.style.width =
				((speed - min) / (max - min) * 100) + "%";
		}

		function changeSpeed(amount) {

			speed += amount;

			if (speed < min)
				speed = min;

			if (speed > max)
				speed = max;

			updateSpeed();

			if (held.has("a"))
				tx("turret:speed:-" + speed);

			if (held.has("d"))
				tx("turret:speed:" + speed);
		}


		/* =========================
			Keyboard
			========================= */

		function press(key) {

			if (key === "a")
				tx("turret:speed:-" + speed);

			if (key === "d")
				tx("turret:speed:" + speed);
		}

		function release(key) {

			if (key === "a" || key === "d")
				tx("turret:stop");
		}


		document.addEventListener("keydown", e => {

			let k = e.key.toLowerCase();

			if (e.shiftKey && k === "s") {

				e.preventDefault();

				tx("system:stop");

				held.clear();

				return;
			}

			if (k === "arrowleft") {

				e.preventDefault();

				changeSpeed(-step);

				return;
			}

			if (k === "arrowright") {

				e.preventDefault();

				changeSpeed(step);

				return;
			}

			if ((k === "a" || k === "d") && !held.has(k)) {

				held.add(k);

				press(k);
			}
		});


		document.addEventListener("keyup", e => {

			let k = e.key.toLowerCase();

			if (k === "a" || k === "d") {

				held.delete(k);

				release(k);
			}
		});


		/* =========================
			Touch slider
			========================= */

		function showTouch(v) {

			tspeed.innerText =
				"Speed: " + Math.abs(v);

			if (v < 0)
				dir.innerText = "Turret: Left";

			else if (v > 0)
				dir.innerText = "Turret: Right";

			else
				dir.innerText = "Stopped";
		}


		slider.addEventListener("input", () => {

			let v = Number(slider.value);

			showTouch(v);

			tx(
				v
					? "turret:speed:" + v
					: "turret:stop"
			);
		});


		slider.addEventListener("change", () => {

			slider.value = 0;

			showTouch(0);

			tx("turret:stop");
		});


		/* =========================
			Safety
			========================= */

		window.addEventListener("blur", () => {

			held.forEach(release);

			held.clear();

			slider.value = 0;

			showTouch(0);

			tx("turret:stop");
		});


		/* =========================
			Start
			========================= */

		updateSpeed();
		showTouch(0);
	</script>

</body>

</html>
