<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Material Handler - Drive Console</title>

<link rel="icon" href="/favicon.ico">


<style>
body{
background:#0f1117;
color:white;
font-family:Segoe UI,Arial,sans-serif;
text-align:center;
margin:0;
padding:20px;
}

.card{
max-width:500px;
margin:auto;
background:#1a1d26;
border-radius:18px;
padding:25px;
box-shadow:0 0 20px rgba(0,0,0,.5);
}

h1{
color:#4da6ff;
margin-top:0;
margin-bottom:20px;
}

button{
width:100px;
height:75px;
font-size:28px;
border:none;
border-radius:12px;
background:#2d3446;
color:white;
margin:6px;
cursor:pointer;
user-select:none;
touch-action:none;
transition:.15s;
}

button:hover{
background:#3e4a66;
}

button:active{
transform:scale(.95);
}

.navBtn{
width:260px;
height:60px;
font-size:20px;
background:#0078ff;
}

.navBtn:hover{
background:#2893ff;
}

#status{
font-size:18px;
margin-bottom:15px;
font-weight:bold;
}

h3{
margin-top:25px;
margin-bottom:10px;
color:#dddddd;
}

hr{
border:1px solid #333;
margin:25px 0;
}

.info{
margin-top:20px;
color:#bfbfbf;
font-size:15px;
line-height:1.6;
}

.active{
background:#00b894 !important;
box-shadow:0 0 18px #00b894;
transform:scale(.95);
}

@media (max-width:600px){

body{
padding:10px;
}

.card{
padding:18px;
}

button{
width:90px;
height:70px;
font-size:24px;
}

.navBtn{
width:220px;
height:56px;
font-size:18px;
}

.info{
font-size:14px;
}

}
</style>

</head>
<body>

<div class="card">

<div id="status">🔴 Disconnected</div>

<h1>Drive Console</h1>

<a href="/superstructure.html">
<button class="navBtn">
Superstructure Controls
</button>
</a>

<br><br>

<button id="wBtn">W</button>

<br>

<button id="aBtn">A</button>
<button id="dBtn">D</button>

<br>

<button id="sBtn">S</button>

<hr>

<h3>Horn</h3>

<button id="hBtn">H</button>

<div class="info">

W = Forward<br>
S = Reverse<br>
A = Steer Left<br>
D = Steer Right<br>
H = Horn<br><br>

Hold keys for continuous movement.<br>
Shift + S = Emergency Stop

</div>

</div>

<script>

function setActive(key,state){

    const map={
        "w":"wBtn",
        "a":"aBtn",
        "s":"sBtn",
        "d":"dBtn",
        "h":"hBtn"
    };

    const id=map[key];

    if(!id) return;

    const btn=document.getElementById(id);

    if(!btn) return;

    if(state)
        btn.classList.add("active");
    else
        btn.classList.remove("active");
}

let ws;
let held=new Set();

let lastMessage=Date.now();

function connect(){

    ws=new WebSocket(`ws://${location.host}/ws`);

    ws.onopen=()=>{

        document.getElementById("status").innerHTML="🟢 Connected";

        lastMessage=Date.now();

    };

    ws.onmessage=()=>{

        lastMessage=Date.now();

    };

}

connect();

function tx(cmd){

    if(ws && ws.readyState===WebSocket.OPEN)
        ws.send(cmd);

}


function press(k){

    switch(k){
case "w":
    tx("drive:forward");
    break;

case "s":
    tx("drive:reverse");
    break;

case "a":
    tx("steer:left");
    break;

case "d":
    tx("steer:right");
    break;

case "h":
    tx("nano:hornon");
    break;
        default:
            return;

    }

    setActive(k,true);

}

function release(k){

    switch(k){
case "w":
case "s":
    tx("drive:stop");
    break;

case "a":
case "d":
    tx("steer:center");
    break;

case "h":
    tx("nano:hornoff");
    break;
        default:
            return;

    }

    setActive(k,false);

}

document.addEventListener("keydown",e=>{

    const k=e.key.toLowerCase();

    if(e.shiftKey && k=="s"){

      tx("system:stop");

        held.clear();

        document.querySelectorAll("button").forEach(btn=>{
            btn.classList.remove("active");
        });

        return;
    }

    if(held.has(k))
        return;

    held.add(k);

    press(k);

});

document.addEventListener("keyup",e=>{

    const k=e.key.toLowerCase();

    held.delete(k);

    release(k);

});

window.addEventListener("blur",()=>{

    held.forEach(k=>release(k));

    held.clear();

});

document.addEventListener("visibilitychange",()=>{

    if(document.hidden){

        held.forEach(k=>release(k));

        held.clear();

    }

});

function bindButton(id,key){

    const btn=document.getElementById(id);

    btn.addEventListener("mousedown",()=>press(key));

    btn.addEventListener("mouseup",()=>release(key));

    btn.addEventListener("mouseleave",()=>release(key));

    btn.addEventListener("touchstart",e=>{

        e.preventDefault();

        if(!held.has(key)){

            held.add(key);

            press(key);

        }

    });

    btn.addEventListener("touchend",e=>{

        e.preventDefault();

        held.delete(key);

        release(key);

    });

}

bindButton("wBtn","w");
bindButton("aBtn","a");
bindButton("sBtn","s");
bindButton("dBtn","d");
bindButton("hBtn","h");

</script>
</body>
</html>
