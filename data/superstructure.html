<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Material Handler - Superstructure</title>

<link rel="icon" href="/favicon.ico">

<style>

body{
background:#0f1117;
color:white;
font-family:Segoe UI,Arial,sans-serif;
text-align:center;
margin:0;
padding:20px;
}

.card{
max-width:700px;
margin:auto;
background:#1a1d26;
border-radius:18px;
padding:25px;
box-shadow:0 0 20px rgba(0,0,0,.5);
}

h1{
color:#4da6ff;
margin-top:0;
}

h3{
margin-top:25px;
margin-bottom:12px;
color:#ddd;
}

button{
width:90px;
height:70px;
font-size:24px;
border:none;
border-radius:12px;
background:#2d3446;
color:white;
margin:6px;
cursor:pointer;
user-select:none;
touch-action:none;
transition:.15s;
}

button:hover{
background:#3e4a66;
}

button:active{
transform:scale(.95);
}

.navBtn{
width:260px;
height:60px;
font-size:20px;
background:#0078ff;
}

.navBtn:hover{
background:#2893ff;
}

#status{
font-size:18px;
margin-bottom:15px;
font-weight:bold;
}

.active{
background:#00b894 !important;
box-shadow:0 0 18px #00b894;
transform:scale(.95);
}

.modal{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.85);
}

.modalBox{
background:#1a1d26;
padding:25px;
border-radius:16px;
width:320px;
box-shadow:0 0 20px rgba(0,0,0,.6);
}

.modalBox button{
width:150px;
height:60px;
}

hr{
border:1px solid #333;
margin:25px 0;
}

.info{
margin-top:18px;
color:#bfbfbf;
font-size:15px;
line-height:1.6;
}

@media(max-width:600px){

.card{
padding:18px;
}

button{
width:80px;
height:65px;
font-size:22px;
}

.navBtn{
width:220px;
height:56px;
font-size:18px;
}

}

</style>

</head>

<body>

<div id="startup" class="modal">

<div class="modalBox">

<h2>Cabin Position</h2>

<p>Select current cabin position</p>

<button onclick="cabinUp()">Raised</button>

<br><br>

<button onclick="cabinDown()">Lowered</button>

</div>

</div>

<div class="card">

<div id="status">🔴 Disconnected</div>

<h1>Superstructure</h1>

<a href="/main.html">
<button class="navBtn">
Drive Console
</button>
</a>

<hr>

<h3>Servo Controls</h3>

<button id="qBtn">Q</button>
<button id="wBtn">W</button>
<button id="eBtn">E</button>

<br>

<button id="aBtn">A</button>
<button id="sBtn">S</button>
<button id="dBtn">D</button>

<hr>

<h3>Cabin</h3>

<button id="gBtn">G</button>

<hr>

<h3>Turret</h3>

<button id="zBtn">Z</button>
<button id="cBtn">C</button>

<h3>Horn</h3>

<button id="hBtn">H</button>

<div class="info">

<div class="info">

Q / A = Servo 1<br>
W / S = Servo 2<br>
E / D = Servo 3<br>
G = Toggle Cabin<br>
Z / C = Rotate Turret

</div>

</div>
<script>

function setActive(key,state){

    const map={
        "q":"qBtn",
        "w":"wBtn",
        "e":"eBtn",
        "a":"aBtn",
        "s":"sBtn",
        "d":"dBtn",
        "g":"gBtn",
        "z":"zBtn",
        "c":"cBtn"
    };

    const id=map[key];

    if(!id) return;

    const btn=document.getElementById(id);

    if(state)
        btn.classList.add("active");
    else
        btn.classList.remove("active");
}

let qHeld=false;
let aHeld=false;

let wHeld=false;
let sHeld=false;

let eHeld=false;
let dHeld=false;

let ws;
let held=new Set();

let lastMessage=Date.now();

function connect(){

    ws=new WebSocket(`ws://${location.host}/ws`);

    ws.onopen=()=>{

        document.getElementById("status").innerHTML="🟢 Connected";

        document.getElementById("startup").style.display="flex";

        lastMessage=Date.now();

    };

    ws.onmessage=()=>{

        lastMessage=Date.now();

    };

}

connect();

function tx(cmd){

    if(ws && ws.readyState===WebSocket.OPEN)
        ws.send(cmd);

}

function cabinUp(){

    tx("nano:cabinup");

    setTimeout(()=>tx("nano:s4"),100);

    document.getElementById("startup").style.display="none";

}

function cabinDown(){

    tx("nano:cabindown");

    document.getElementById("startup").style.display="none";

}

function updateServo1(){

    if(qHeld && !aHeld)
        tx("nano:s145");

    else if(aHeld && !qHeld)
        tx("nano:s1135");

    else
        tx("nano:s190");

}

function updateServo2(){

    if(wHeld && !sHeld)
        tx("nano:s245");

    else if(sHeld && !wHeld)
        tx("nano:s2135");

    else
        tx("nano:s290");

}

function updateServo3(){

    if(eHeld && !dHeld)
        tx("nano:s345");

    else if(dHeld && !eHeld)
        tx("nano:s3135");

    else
        tx("nano:s390");

}

function press(k){

    switch(k){

        case "q":
            qHeld=true;
            updateServo1();
            break;

        case "a":
            aHeld=true;
            updateServo1();
            break;

        case "w":
            wHeld=true;
            updateServo2();
            break;

        case "s":
            sHeld=true;
            updateServo2();
            break;

        case "e":
            eHeld=true;
            updateServo3();
            break;

        case "d":
            dHeld=true;
            updateServo3();
            break;

        case "g":
            tx("nano:s4");
            break;

        case "z":
            tx("turret:left");
            break;

        case "c":
            tx("turret:right");
            break;

        default:
            return;
    }

    setActive(k,true);

}

function release(k){

    switch(k){

        case "q":
            qHeld=false;
            updateServo1();
            break;

        case "a":
            aHeld=false;
            updateServo1();
            break;

        case "w":
            wHeld=false;
            updateServo2();
            break;

        case "s":
            sHeld=false;
            updateServo2();
            break;

        case "e":
            eHeld=false;
            updateServo3();
            break;

        case "d":
            dHeld=false;
            updateServo3();
            break;

        case "z":
        case "c":
            tx("turret:stop");
            break;

        default:
            return;
    }

    setActive(k,false);

}

document.addEventListener("keydown",e=>{

    const k=e.key.toLowerCase();

    if(held.has(k))
        return;

    held.add(k);

    press(k);

});

document.addEventListener("keyup",e=>{

    const k=e.key.toLowerCase();

    held.delete(k);

    release(k);

});

window.addEventListener("blur",()=>{

    held.forEach(k=>release(k));

    held.clear();

});

document.addEventListener("visibilitychange",()=>{

    if(document.hidden){

        held.forEach(k=>release(k));

        held.clear();

    }

});

function bind(id,key){

    const btn=document.getElementById(id);

    btn.addEventListener("mousedown",()=>press(key));

    btn.addEventListener("mouseup",()=>release(key));

    btn.addEventListener("mouseleave",()=>release(key));

    btn.addEventListener("touchstart",e=>{

        e.preventDefault();

        if(!held.has(key)){

            held.add(key);

            press(key);

        }

    });

    btn.addEventListener("touchend",e=>{

        e.preventDefault();

        held.delete(key);

        release(key);

    });

}

bind("qBtn","q");
bind("wBtn","w");
bind("eBtn","e");

bind("aBtn","a");
bind("sBtn","s");
bind("dBtn","d");

bind("gBtn","g");

bind("zBtn","z");
bind("cBtn","c");

</script>
</body>
</html>
